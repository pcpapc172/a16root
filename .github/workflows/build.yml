name: build-ghostlock

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux
          make API=35
          file ghostlock
          ls -la ghostlock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-a16
          path: ghostlock
          if-no-files-found: error
